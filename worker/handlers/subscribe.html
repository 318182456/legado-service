<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legado 资源订阅中心</title>
    <!-- Favicon 引入 -->
    <link rel="icon" type="image/png" href="/repo/logo.png">
    
    <!-- 引入 Google Premium 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --primary-bg: rgba(139, 92, 246, 0.15);
            --on-primary: #ffffff;
            --surface: #070510;
            --surface-container: rgba(18, 15, 36, 0.7);
            --outline: #4b4869;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow: rgba(0, 0, 0, 0.5);
            --card-border: rgba(255, 255, 255, 0.05);
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            position: relative;
            touch-action: pan-y; /* 仅允许上下滚动，物理禁止左右滑动手势 */
        }
        
        body {
            font-family: 'Outfit', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(circle at 50% 0%, #161233 0%, #070510 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 绚丽背景极光 */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 15%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
            animation: float-slow 18s infinite alternate ease-in-out;
        }
        body::after {
            content: '';
            position: absolute;
            top: 25%;
            right: 5%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
            animation: float-slow-reverse 22s infinite alternate ease-in-out;
        }
        
        @keyframes float-slow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }
        @keyframes float-slow-reverse {
            0% { transform: translate(0, 0) scale(1.1); }
            100% { transform: translate(-50px, -20px) scale(0.9); }
        }
        
        /* 尊贵版品牌 Header */
        .brand-header {
            text-align: center;
            padding: 45px 20px 25px;
            position: relative;
            z-index: 2;
            width: 100%;
        }
        
        .logo-container {
            position: relative;
            width: 95px;
            height: 95px;
            margin: 0 auto 20px;
        }
        
        .app-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            border-radius: 24px;
            filter: blur(14px);
            opacity: 0.65;
            z-index: 1;
            animation: logo-pulse 4s infinite alternate ease-in-out;
        }
        
        @keyframes logo-pulse {
            0% { transform: scale(0.94); opacity: 0.45; }
            100% { transform: scale(1.06); opacity: 0.85; }
        }
        
        .brand-title {
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 10px;
            letter-spacing: -0.5px;
        }
        
        .brand-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            max-width: 320px;
            margin: 0 auto;
            line-height: 1.4;
        }
        
        /* 选项卡结构 */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 5px;
            border-radius: 15px;
            margin: 20px 0;
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            border-radius: 11px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        /* 内容容器 */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 0 20px 45px;
            display: none;
            position: relative;
            z-index: 2;
        }
        .container.active { 
            display: block; 
        }
        
        /* 磨砂玻璃卡片 */
        .card {
            background: var(--surface-container);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 22px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 12px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid var(--card-border);
        }
        
        .card h3 { 
            font-size: 1rem; 
            margin-bottom: 18px; 
            color: #cbd5e1; 
            border-left: 4px solid var(--primary); 
            padding-left: 12px; 
        }
        
        /* Jsoup 隐藏 APP 图标 DOM 的特殊处理 */
        .item-icon {
            display: none !important;
        }
        
        #tab-0 h3 {
            margin: 0;
            padding: 0;
            border: none;
            font-size: inherit;
            font-weight: normal;
            display: block;
        }
        
        /* 尊贵立体按钮 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
        }
        
        .btn:active { 
            transform: translateY(1px) scale(0.98); 
        }
        
        .btn-p { 
            background: linear-gradient(135deg, #6366f1, #8b5cf6); 
            color: white; 
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }
        .btn-p:hover {
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.55);
        }
        
        .btn-s { 
            background: linear-gradient(135deg, #0284c7, #06b6d4); 
            color: white; 
            box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
        }
        .btn-s:hover {
            box-shadow: 0 6px 22px rgba(2, 132, 199, 0.55);
        }
        
        .btn-o { 
            background: linear-gradient(135deg, #ec4899, #f43f5e); 
            color: white; 
            box-shadow: 0 4px 16px rgba(236, 72, 153, 0.35);
        }
        .btn-o:hover {
            box-shadow: 0 6px 22px rgba(236, 72, 153, 0.55);
        }
        
        .btn-t { 
            background: linear-gradient(135deg, #ec4899, #8b5cf6); 
            color: white; 
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
        }
        .btn-t:hover {
            box-shadow: 0 6px 22px rgba(139, 92, 246, 0.55);
        }
        
        .btn-v { 
            background: linear-gradient(135deg, #10b981, #059669); 
            color: white; 
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
        }
        .btn-v:hover {
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.55);
        }
        
        .btn-d { 
            background: rgba(239, 68, 68, 0.08); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .btn-d:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        
        /* 预览网格系统 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 14px; 
            margin-top: 10px; 
        }
        
        /* 手机端精美 2 列排列自适应优化，彻底消除左右滑动 */
        @media (max-width: 480px) {
            .container {
                padding: 0 10px 30px;
                max-width: 100%;
            }
            .card {
                padding: 16px 10px;
                border-radius: 18px;
                margin-bottom: 14px;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                width: 100%;
            }
            .res-item {
                padding: 10px 8px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .preview-container {
                width: 95px;
                margin: 0 auto 10px;
                border-radius: 12px;
                padding: 3px;
            }
            .res-name {
                font-size: 0.78rem;
                margin-bottom: 8px;
                line-height: 1.2;
            }
            .res-btn {
                font-size: 0.72rem;
                padding: 8px 4px;
                border-radius: 8px;
                display: block;
                width: 100%;
                text-align: center;
            }
        }
        
        .res-item {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        
        .res-item:hover {
            transform: translateY(-5px);
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.18);
        }
        
        .res-name { 
            font-size: 0.82rem; 
            font-weight: 700; 
            margin-bottom: 10px; 
            color: #cbd5e1; 
            word-break: break-all; 
        }
        
        .res-btn {
            font-size: 0.78rem;
            padding: 7px;
            background: var(--primary-bg);
            border-radius: 10px;
            color: #c084fc;
            text-decoration: none;
            border: 1px solid rgba(139, 92, 246, 0.25);
            font-weight: 700;
            transition: all 0.25s;
        }
        
        .res-btn:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 14px var(--primary-glow);
        }
        
        /* 手机预览框 */
        .preview-container {
            width: 105px;
            margin: 0 auto 10px;
            aspect-ratio: 9/19.5;
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #09090b;
            padding: 3px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .preview-screen {
            width: 100%;
            height: 100%;
            border-radius: 13px;
            overflow: hidden;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255,255,255,0.15);
            font-size: 10px;
        }
        
        .preview-container.has-image { 
            background: var(--surface-container); 
        }
        .preview-container.no-image { 
            background: #000; 
            padding: 1.5px; 
        }
        
        .preview-body {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 6px;
        }
        
        /* 底部提示气泡 */
        #status-bar {
            position: fixed;
            bottom: 25px;
            left: 20px;
            right: 20px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(20, 18, 38, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .preview-inner {
            transform-origin: top left;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 11px;
        }
    </style>
</head>
<body>
    <!-- 极光头部 -->
    <div class="brand-header">
        <div class="logo-container">
            <img src="/repo/logo.png" alt="Legado Logo" class="app-logo" />
            <div class="logo-glow"></div>
        </div>
        <h1 class="brand-title">Legado 订阅中心</h1>
        <p class="brand-subtitle">自托管、全自动的阅读资源与主题整合中心</p>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">订阅整合</div>
        <div class="tab" onclick="switchTab(1)">精选主题</div>
        <div class="tab" onclick="switchTab(2)">发现订阅</div>
    </div>
    
    <!-- Tab 0: 订阅整合 -->
    <div id="tab-0" class="container active">
        <div class="card">
            <h3>
                <img src="/repo/logo.png" alt="icon" class="item-icon" />
                <a href="legado://import/bookSource?src={{SOURCES_URL}}" class="btn btn-p">📦 导入全量整合书源</a>
            </h3>
            <h3>
                <img src="/repo/logo.png" alt="icon" class="item-icon" />
                <a href="legado://import/replaceRule?src={{RULES_URL}}" class="btn btn-s">✨ 导入全量净化规则</a>
            </h3>
            <h3>
                <img src="/repo/logo.png" alt="icon" class="item-icon" />
                <a href="legado://import/txtTocRule?src={{TXT_TOC_RULES_URL}}" class="btn btn-t">📖 导入全量目录规则</a>
            </h3>
            <h3>
                <img src="/repo/logo.png" alt="icon" class="item-icon" />
                <a href="legado://import/dictRule?src={{DICT_RULES_URL}}" class="btn btn-v">🔍 导入全量字典规则</a>
            </h3>
        </div>
        <div class="card">
            <p style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:12px;">高级操作</p>
            <a href="#" onclick="clearAndImport(); return false;" class="btn btn-d">🗑️ 清空并重新订阅</a>
        </div>
    </div>
    
    <!-- Tab 1: 精选主题 -->
    <div id="tab-1" class="container">
        <div id="res-loading" style="text-align:center; padding:45px; color:var(--text-secondary);">正在从云端获取精选主题...</div>
        <div id="res-content"></div>
    </div>
    
    <!-- Tab 2: 发现订阅 -->
    <div id="tab-2" class="container">
        <!-- 将本中心整体添加到阅读发现 -->
        <div class="card" style="margin-bottom: 20px; background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%); border: 1px solid rgba(139, 92, 246, 0.2); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.05);">
            <h3 style="margin-bottom: 8px; color: #a78bfa; font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px;">
                🛎️ 掌上订阅中心
            </h3>
            <p style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6;">
                将本站整体添加到手机开源阅读 App 的「发现」板块中，即可随时在手机端直接浏览、检索和一键安装这里的所有精选书源、规则与精选主题！
            </p>
            <a href="legado://import/rssSource?src={{INFO_URL}}" class="btn btn-o" style="display: flex; align-items: center; justify-content: center; font-size: 0.8rem; padding: 10px 0; border-radius: 8px; width: 100%; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15); font-weight: 700;">📌 将本中心添加到阅读发现</a>
        </div>
        
        <div id="rss-loading" style="text-align:center; padding:45px; color:var(--text-secondary);">正在从云端获取发现订阅...</div>
        <div id="rss-content"></div>
    </div>
    
    <div id="status-bar"></div>
    
    <!-- 导入进度遮罩层 -->
    <div id="import-modal" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(7, 5, 16, 0.88); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); z-index:9999; display:none; align-items:center; justify-content:center; opacity:0; transition:opacity 0.3s ease;">
        <div style="background:rgba(18, 15, 36, 0.85); border:1px solid rgba(255, 255, 255, 0.08); border-radius:24px; padding:30px; width:85%; max-width:320px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); transform:scale(0.9); transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);" id="import-card">
            <!-- 进度环容器 -->
            <div style="position:relative; width:100px; height:100px; margin:0 auto 20px;">
                <svg width="100" height="100" viewBox="0 0 100 100" style="transform:rotate(-90deg);">
                    <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.05)" stroke-width="6" fill="none" />
                    <circle cx="50" cy="50" r="40" stroke="url(#progress-gradient)" stroke-width="6" fill="none" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round" id="progress-circle" style="transition:stroke-dashoffset 0.1s linear;" />
                    <defs>
                        <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#8b5cf6" />
                            <stop offset="100%" stop-color="#06b6d4" />
                        </linearGradient>
                    </defs>
                </svg>
                <div style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:800; color:#ffffff; text-shadow:0 0 10px rgba(139,92,246,0.5);" id="progress-text">0%</div>
            </div>
            <h4 style="font-size:1rem; font-weight:700; color:#f8fafc; margin-bottom:8px;" id="import-title">正在准备导入...</h4>
            <p style="font-size:0.8rem; color:#94a3b8; line-height:1.4;" id="import-tip">请稍候</p>
        </div>
    </div>
    
    <script>
        const API_ORIGIN = '{{ORIGIN}}';
        
        window.triggerThemeImport = function(importUrl, themeName) {
            const modal = document.getElementById('import-modal');
            const card = document.getElementById('import-card');
            const circle = document.getElementById('progress-circle');
            const text = document.getElementById('progress-text');
            const title = document.getElementById('import-title');
            const tip = document.getElementById('import-tip');
            
            if (!modal || !circle || !text || !title || !tip) {
                // 降级直接导入
                window.location.href = importUrl;
                return;
            }
            
            // 展现磨砂玻璃面板
            modal.style.display = 'flex';
            modal.offsetHeight; // 触发重绘以确保 css opacity 动画生效
            modal.style.opacity = '1';
            card.style.transform = 'scale(1)';
            
            let progress = 0;
            const strokeDasharray = 251.2; // 2 * PI * r (r=40)
            circle.style.strokeDashoffset = strokeDasharray;
            text.textContent = '0%';
            title.textContent = '正在导入 ' + themeName;
            tip.textContent = '准备连接阅读 App...';
            
            const duration = 1600; // 动画时长
            const interval = 25;   // 每25ms更新一次
            const steps = duration / interval;
            const increment = 100 / steps;
            
            const timer = setInterval(() => {
                progress += increment;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    
                    text.textContent = '100%';
                    circle.style.strokeDashoffset = '0';
                    title.textContent = '🎉 导入指令已发送';
                    tip.textContent = '请在弹出的阅读界面中确认保存';
                    
                    // 唤起 Legado 进行导入
                    window.location.href = importUrl;
                    
                    // 延时关闭 Modal
                    setTimeout(() => {
                        modal.style.opacity = '0';
                        card.style.transform = 'scale(0.9)';
                        setTimeout(() => {
                            modal.style.display = 'none';
                        }, 300);
                    }, 1200);
                } else {
                    const rounded = Math.floor(progress);
                    text.textContent = rounded + '%';
                    
                    // 计算 SVG 环状弧线偏移
                    const offset = strokeDasharray - (strokeDasharray * progress) / 100;
                    circle.style.strokeDashoffset = offset;
                    
                    // 动态更新步骤提示文案
                    if (rounded < 30) {
                        tip.textContent = '正在解析主题配置数据...';
                    } else if (rounded < 65) {
                        tip.textContent = '正在拉起阅读 App 导入配置...';
                    } else {
                        tip.textContent = '即将完成...';
                    }
                }
            }, interval);
        };
        
        window.switchTab = function(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
            document.querySelectorAll('.container').forEach((c, i) => c.classList.toggle('active', i === idx));
            if (idx === 1) loadResources();
            if (idx === 2) loadRssSources();
        }
        
        async function loadResources() {
            const container = document.getElementById('res-content');
            if (container.innerHTML !== '') return;
            
            try {
                const res = await fetch('/api/custom-themes');
                const json = await res.json();
                const items = json.data || [];
                console.log('[Theme] Loaded', items.length, 'themes');
                
                let html = '<div class="card"><h3>🎨 精选推荐</h3><div class="grid">';
                items.forEach(item => {
                    const exportUrl = API_ORIGIN + '/api/custom-themes/' + item.id + '/export';
                    const importUrl = 'legado://import/readConfig?src=' + encodeURIComponent(exportUrl);
                    
                    html += '<div class="res-item">' +
                            '<div class="preview-container" id="preview-' + item.id + '"></div>' +
                            '<div class="res-name">' + item.name + '</div>' +
                            '<a href="javascript:void(0);" onclick="triggerThemeImport(\'' + importUrl + '\', \'' + item.name.replace(/'/g, "\\'") + '\')" class="res-btn">一键导入</a>' +
                            '</div>';
                });
                html += '</div></div>';
                
                container.innerHTML = html;
                
                // 渲染预览
                items.forEach(item => {
                    try {
                        const cfg = typeof item.config === 'string' ? JSON.parse(item.config) : item.config;
                        renderThemePreview(item.id, cfg, item.preview_url);
                    } catch (e) {
                        console.error('Failed to parse theme config', item.id, e);
                    }
                });
                document.getElementById('res-loading').style.display = 'none';
            } catch (e) {
                console.error('[Theme] Load Error', e);
                container.innerHTML = '<div style="color:red;padding:20px;">加载失败: ' + e.message + '</div>';
            }
        }

        async function loadRssSources() {
            const container = document.getElementById('rss-content');
            if (container.innerHTML !== '') return;
            
            try {
                const res = await fetch('/api/rss-sources');
                const json = await res.json();
                const items = json.data || [];
                console.log('[Rss] Loaded', items.length, 'rss sources');
                
                let html = '<div class="card">' +
                           '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.06); padding-bottom:10px;">' +
                           '<h3 style="margin-bottom:0">📌 发现订阅大全</h3>' +
                           '<a href="javascript:void(0);" onclick="triggerRssImport(\'legado://import/rssSource?src={{RSS_ALL_URL}}\', \'全量订阅源\')" class="res-btn" style="padding:4px 10px; font-size:0.75rem; background:linear-gradient(135deg, #10b981, #059669); min-width:auto; width:auto; border-radius:6px; box-shadow:0 4px 12px rgba(16,185,129,0.25)">一键导入全部</a>' +
                           '</div>' +
                           '<div class="grid">';
                
                items.forEach(item => {
                    const exportUrl = API_ORIGIN + '/api/rss-sources/' + item.index + '/export';
                    const importUrl = 'legado://import/rssSource?src=' + encodeURIComponent(exportUrl);
                    const iconUrl = item.sourceIcon || '/repo/logo.png';
                    
                    html += '<div class="res-item" style="padding:15px 10px; min-height:auto; display:flex; flex-direction:column; align-items:center; justify-content:center;">' +
                            '<div style="width:48px; height:48px; border-radius:12px; background:rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; margin-bottom:8px; border:1px solid rgba(255,255,255,0.05);">' +
                            '<img src="' + iconUrl + '" style="width:36px; height:36px; border-radius:8px; object-fit:contain;" onerror="this.src=\'/repo/logo.png\'">' +
                            '</div>' +
                            '<div class="res-name" style="margin-top:0; font-size:0.8rem; font-weight:600; text-align:center; height:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%;">' + item.sourceName + '</div>' +
                            '<div style="font-size:0.65rem; color:var(--text-secondary); margin-bottom:10px;">' + (item.sourceGroup || '订阅') + '</div>' +
                            '<a href="javascript:void(0);" onclick="triggerRssImport(\'' + importUrl + '\', \'' + item.sourceName.replace(/'/g, "\\'") + '\')" class="res-btn" style="width:80%; font-size:0.7rem; padding:4px 0; border-radius:6px; min-width:auto;">导入此源</a>' +
                            '</div>';
                });
                html += '</div></div>';
                
                container.innerHTML = html;
                document.getElementById('rss-loading').style.display = 'none';
            } catch (e) {
                console.error('[Rss] Load Error', e);
                container.innerHTML = '<div style="color:red;padding:20px;">加载失败: ' + e.message + '</div>';
            }
        }

        window.triggerRssImport = function(importUrl, sourceName) {
            const modal = document.getElementById('import-modal');
            const card = document.getElementById('import-card');
            const circle = document.getElementById('progress-circle');
            const text = document.getElementById('progress-text');
            const title = document.getElementById('import-title');
            const tip = document.getElementById('import-tip');
            
            if (!modal || !circle || !text || !title || !tip) {
                window.location.href = importUrl;
                return;
            }
            
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                card.style.transform = 'scale(1)';
            }, 10);
            
            const strokeDasharray = 251.2;
            circle.style.strokeDashoffset = strokeDasharray;
            text.textContent = '0%';
            title.textContent = '正在获取 ' + sourceName;
            tip.textContent = '准备建立连接...';
            
            let progress = 0;
            const duration = 800;
            const interval = 20;
            const step = (100 / duration) * interval;
            
            const timer = setInterval(() => {
                progress += step;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                    
                    text.textContent = '100%';
                    circle.style.strokeDashoffset = '0';
                    title.textContent = '🎉 导入指令已发送';
                    tip.textContent = '请在弹出的阅读界面中确认保存';
                    
                    window.location.href = importUrl;
                    
                    setTimeout(() => {
                        modal.style.opacity = '0';
                        card.style.transform = 'scale(0.9)';
                        setTimeout(() => {
                            modal.style.display = 'none';
                        }, 300);
                    }, 1200);
                } else {
                    const rounded = Math.floor(progress);
                    text.textContent = rounded + '%';
                    const offset = strokeDasharray - (strokeDasharray * progress) / 100;
                    circle.style.strokeDashoffset = offset;
                    
                    if (rounded < 30) {
                        tip.textContent = '正在解析订阅配置数据...';
                    } else if (rounded < 65) {
                        tip.textContent = '正在拉起阅读 App 导入源...';
                    } else {
                        tip.textContent = '即将完成...';
                    }
                }
            }, interval);
        };

        
        // --- 以下函数将由 Worker 动态注入字符串形式 ---
        // {{INJECTED_FUNCTIONS}}
        
        function renderThemePreview(id, config, savedPreviewUrl) {
            const container = document.getElementById('preview-' + id);
            if (!container) return;
            
            const pUrl = savedPreviewUrl || config.preview_url;
            if (pUrl) {
                container.innerHTML = '<div class="preview-screen">' +
                                      '<img src="' + pUrl + '" loading="lazy">' +
                                      '</div>';
            } else {
                container.innerHTML = '<div class="preview-screen">' +
                                      '<div class="preview-placeholder">' +
                                      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>' +
                                      '<div style="margin-top:4px">暂无预览</div>' +
                                      '</div></div>';
            }
        }
        
        function showStatus(msg) {
            const bar = document.getElementById('status-bar');
            bar.textContent = msg;
            bar.style.display = 'block';
            setTimeout(() => bar.style.display = 'none', 3000);
        }
        
        async function clearAndImport() {
            if (!confirm('将清空本地所有书源并同步云端，确定吗？')) return;
            const port = 1122;
            const base = 'http://127.0.0.1:' + port;
            showStatus('正在尝试连接本地服务...');
            try {
                const res = await fetch(base + '/getBookSources');
                const sources = await res.json();
                const list = Array.isArray(sources) ? sources : (sources.data || []);
                if (list.length > 0) {
                    showStatus('正在删除 ' + list.length + ' 个书源...');
                    await fetch(base + '/deleteBookSources', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(list)
                    });
                }
                showStatus('✅ 已清空，正在拉起导入...');
                const subUrl = API_ORIGIN + '/subscribe/sources';
                setTimeout(() => {
                    location.href = 'legado://import/bookSource?src=' + encodeURIComponent(subUrl);
                }, 1000);
            } catch (e) {
                showStatus('❌ 失败: 请确保阅读 Web 服务已开启 (端口 ' + port + ')');
            }
        }
    </script>
