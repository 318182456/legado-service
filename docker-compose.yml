services:
    app:
        container_name: legado-service
        image: ghcr.io/318182456/legado-service:main
        ports:
            - 3008:3000
        environment:
            - DATABASE_URL=postgres://legadosub:legadosub@postgres:5432/legadosub
            - REDIS_URL=redis://redis:6379
            - ASSETS_PATH=/app/assets
            - PORT=3000
            - API_SECRET=wal116266321
            - THREAD_COUNT=4
            - NO_PROXY=172.17.0.1,127.0.0.1,localhost,192.168.3.0/24         ##保持默认
            - ALL_PROXY=http://192.168.3.12:7890              ## 更换为自己的http代理
            - HTTPS_PROXY=http://192.168.3.12:7890              ## 更换为自己的http代理
            - HTTP_PROXY=http://192.168.3.12:7890             ## 更换为自己的http代理
            - READER_URL=http://legado-reader:8080             ## 容器内网代理地址
        volumes:
            - ./app:/app
            - /app/node_modules
            - /volume4/NAS/legado:/app/assets
        restart: always
        networks:
            - postgres-network
        hostname: legado-service

    reader:
        container_name: legado-reader
        image: hectorqin/reader:latest
        ports:
            - 8080:8080
        environment:
            - SPRING_PROFILES_ACTIVE=prod
            - READER_APP_SECURE=true
            - READER_APP_SECUREKEY=wal116266321
            - READER_APP_CACHECHAPTERCONTENT=true
        volumes:
            - ./storage:/storage
        restart: always
        networks:
            - postgres-network
        hostname: legado-reader

networks:
  postgres-network:
    external: true
    name: postgres-network
